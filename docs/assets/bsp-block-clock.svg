<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>BSP block clock: four paid 15-second blocks, each renewed inside a 10-second window, and termination at the first unpaid boundary</title>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#eef0f3"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c3c9d2" stroke-width="2"/>
    </pattern>
    <pattern id="void" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="8" height="8" fill="#fbeaea"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#efc4c4" stroke-width="2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/>
    </marker>
  </defs>

  <!-- Opaque ground so the figure reads on light and dark GitHub themes alike. -->
  <rect x="0.5" y="0.5" width="959" height="399" rx="12" fill="#ffffff" stroke="#d9dde3"/>

  <text x="32" y="42" font-size="18" font-weight="700" fill="#111827">The block clock</text>
  <text x="32" y="64" font-size="13" fill="#4b5563">15 s blocks · 10 s renewal window · each block settled on Hedera before it is served</text>

  <!-- ── Provisioning: after block 1 is paid, before the clock starts (SPEC §5.2) ── -->
  <circle cx="64" cy="140" r="6" fill="#0f766e"/>
  <text x="64" y="118" font-size="11.5" font-weight="600" fill="#0f766e" text-anchor="middle">pay 1</text>
  <rect x="76" y="126" width="74" height="28" rx="4" fill="url(#hatch)" stroke="#c3c9d2"/>
  <text x="113" y="176" font-size="11" fill="#6b7280" text-anchor="middle">provisioning</text>
  <text x="113" y="190" font-size="11" fill="#6b7280" text-anchor="middle">unbilled</text>

  <!-- ── Four paid blocks, 10 px per second, clock starts at x=150 ── -->
  <g>
    <rect x="150" y="120" width="148" height="40" rx="5" fill="#0f766e"/>
    <rect x="300" y="120" width="148" height="40" rx="5" fill="#0f766e"/>
    <rect x="450" y="120" width="148" height="40" rx="5" fill="#0f766e"/>
    <rect x="600" y="120" width="148" height="40" rx="5" fill="#0f766e"/>
    <text x="224" y="145" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">block 1 · paid</text>
    <text x="374" y="145" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">block 2 · paid</text>
    <text x="524" y="145" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">block 3 · paid</text>
    <text x="674" y="145" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">block 4 · paid</text>
  </g>

  <!-- Block 5 is offered but never bought, so it is never served. -->
  <rect x="750" y="120" width="148" height="40" rx="5" fill="url(#void)" stroke="#e5a5a5" stroke-dasharray="4 3"/>
  <text x="824" y="145" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle">block 5 · never served</text>

  <!-- ── Renewal windows: the final 10 s of each block ── -->
  <g fill="#fde7b0" stroke="#e0a526">
    <rect x="200" y="174" width="98" height="18" rx="3"/>
    <rect x="350" y="174" width="98" height="18" rx="3"/>
    <rect x="500" y="174" width="98" height="18" rx="3"/>
    <rect x="650" y="174" width="98" height="18" rx="3"/>
  </g>
  <g font-size="10.5" fill="#92580a" text-anchor="middle">
    <text x="268" y="187">window</text>
    <text x="418" y="187">window</text>
    <text x="568" y="187">window</text>
    <text x="718" y="187">window</text>
  </g>

  <!-- Payments land inside the window, while the current block still runs. -->
  <g stroke="#b7791f" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M222,196 C222,226 296,226 312,166"/>
    <path d="M372,196 C372,226 446,226 462,166"/>
    <path d="M522,196 C522,226 596,226 612,166"/>
  </g>
  <g fill="#b7791f">
    <circle cx="222" cy="183" r="4.5"/>
    <circle cx="372" cy="183" r="4.5"/>
    <circle cx="522" cy="183" r="4.5"/>
  </g>
  <g stroke="#b91c1c" stroke-width="2" stroke-linecap="round">
    <line x1="668" y1="179" x2="676" y2="187"/>
    <line x1="676" y1="179" x2="668" y2="187"/>
  </g>
  <g font-size="11.5" font-weight="600" fill="#92580a" text-anchor="middle">
    <text x="262" y="240">pay 2</text>
    <text x="412" y="240">pay 3</text>
    <text x="562" y="240">pay 4</text>
  </g>
  <text x="690" y="240" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">renter declines</text>

  <!-- ── Time axis and boundaries ── -->
  <line x1="150" y1="262" x2="910" y2="262" stroke="#9ca3af" stroke-width="1.2"/>
  <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3">
    <line x1="300" y1="110" x2="300" y2="262"/>
    <line x1="450" y1="110" x2="450" y2="262"/>
    <line x1="600" y1="110" x2="600" y2="262"/>
  </g>
  <line x1="150" y1="106" x2="150" y2="270" stroke="#111827" stroke-width="2"/>
  <line x1="750" y1="100" x2="750" y2="270" stroke="#b91c1c" stroke-width="2.5"/>
  <g font-size="11.5" fill="#4b5563" text-anchor="middle">
    <text x="150" y="284">0 s</text>
    <text x="300" y="284">15 s</text>
    <text x="450" y="284">30 s</text>
    <text x="600" y="284">45 s</text>
    <text x="750" y="284" fill="#b91c1c" font-weight="700">60 s</text>
  </g>
  <text x="150" y="98" font-size="11.5" font-weight="600" fill="#111827" text-anchor="middle">clock starts · container ready</text>
  <text x="750" y="92" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">paid_through = 4 → terminate</text>

  <!-- ── Legend: the rule the watchdog applies ── -->
  <rect x="32" y="310" width="896" height="68" rx="8" fill="#f6f7f9" stroke="#e5e7eb"/>
  <text x="52" y="336" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#111827">at each boundary: paid_through &gt; block_index ? serve next block : SIGTERM → grace → SIGKILL → receipt</text>
  <text x="52" y="360" font-size="12" fill="#4b5563">Never earlier (a payment may still confirm), never later (that would be unpaid work). The renter's worst case is one block; the provider's is zero.</text>
</svg>
